name: "Build and test orc-pgo"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow_call:
        description: 'To distinguish workflow_call from regular push'
        type: boolean
        required: false
        default: true
      workflow_caller_run_id:
        description: ''
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - "projects/orc-pgo/**"
      - ".github/workflows/build_test_orc_pgo.yml"
  push:
    branches:
      - main
    paths:
      - "projects/orc-pgo/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}-build_test_orc_pgo
  cancel-in-progress: true

jobs:
  coverage-orc-pgo:

    strategy:
      fail-fast: false
      matrix:
        include:
          - {runs-on: "ubuntu-22.04", name: "ubuntu_x86_64", os: "ubuntu", arch: "x86_64"}
          - {runs-on: "ubuntu-22.04-arm", name: "ubuntu_aarch64", os: "ubuntu", arch: "aarch64"}
          - {runs-on: "macos-14", name: "macos_arm64", os: "macos", arch: "arm64"}

    runs-on: ${{ matrix.runs-on }}

    name: "Coverage orc-pgo ${{ matrix.name }}"

    defaults:
      run:
        shell: bash

    env:
      cache-key: orc_pgo_${{ matrix.name }}_clang_${{ format('{0}-{1}', github.ref_name, github.run_number) }}

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup base"
        uses: ./.github/actions/setup_base
        with:
          cache-key: ${{ env.cache-key }}
          restore-key: "orc_pgo_${{ matrix.name }}_clang"
          os: ${{ matrix.os }}
          runs-on: ${{ matrix.runs-on }}
          host-arch: ${{ matrix.arch }}
          target-arch: ${{ matrix.arch }}
          python-version: "3.12"

      - name: "Pip download MLIR from releases"
        if: ${{ !inputs.workflow_call }}
        run: |

          pip download mlir-wheel -f https://github.com/llvm/eudsl/releases/expanded_assets/llvm

      - name: "Download LLVM distro artifact"
        if: ${{ inputs.workflow_call }}
        uses: dawidd6/action-download-artifact@v11
        with:
          name: mlir_wheel_${{ matrix.os == 'ubuntu' && 'manylinux' || matrix.os }}_${{ matrix.arch }}_artifact
          path: "./"
          run_id: ${{ inputs.workflow_caller_run_id }}

      - name: "Unpack LLVM distro"
        run: |

          unzip -q mlir_wheel*.whl
          mv mlir_wheel llvm-install

      - name: "C++ coverage (llvm-cov, threshold 100%)"
        run: |

          # llvm-cov/llvm-profdata must match the instrumenting clang (raw
          # .profraw formats are version-locked): on Linux that is setup_base's
          # llvm-18 ($CC); on macOS the script resolves Apple clang's via xcrun.
          if [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            export LLVM_COV="$(dirname "$CC")/llvm-cov"
            export LLVM_PROFDATA="$(dirname "$CC")/llvm-profdata"
          fi
          LLVM_INSTALL_DIR="$PWD/llvm-install" \
            bash projects/orc-pgo/scripts/cpp_coverage.sh
