name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/deploy_pip_page.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# The Pyodide that runs the deployed pages. Must match the cross-build environment
# the wheel was built against, or the wheel's ABI tag will not load. Keep in sync
# with PYODIDE_VERSION in .github/actions/setup_base/action.yml and the CDN url in
# pages/console/index.html; the "Verify page contents" step checks the latter.
#
# PYODIDE_PY_TAG / PYODIDE_PLATFORM_TAG are what that Pyodide's cross-build env
# reports as python_version and pyemscripten_platform_version. This job does not
# install the xbuildenv (it is a ~400MB download for two strings), so they are
# spelled out here. "Verify page contents" below rejects any wheel in the piplite
# index whose tag disagrees, so a stale value here fails the deploy rather than
# shipping a wheel the runtime cannot install.
env:
  PYODIDE_VERSION: 0.29.4
  PYODIDE_PY_TAG: cp313
  PYODIDE_PLATFORM_TAG: pyemscripten_2025_0_wasm32

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download pip links
        shell: bash
        run: |
          set -euxo pipefail

          wget https://github.com/llvm/eudsl/releases/expanded_assets/mlir-python-bindings
          wget https://github.com/llvm/eudsl/releases/expanded_assets/eudsl
          wget https://github.com/llvm/eudsl/releases/expanded_assets/llvm
          wget https://github.com/llvm/eudsl/releases/expanded_assets/eudsl-python-extras
          cat mlir-python-bindings eudsl llvm eudsl-python-extras > index.html
          sed -i.bak 's/\/llvm\/eudsl/https:\/\/github.com\/llvm\/eudsl/g' index.html
          mkdir -p page && mv index.html page

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Resolve both wheels out of the pip index we just built from the releases,
      # so this job never depends on an artifact belonging to some other run.
      - name: Download latest WASM wheel
        shell: bash
        run: |
          set -euxo pipefail

          # --no-index, or a tag that matches nothing here falls back to PyPI, where
          # `mlir-python-bindings` is a 6kB name-reservation stub tagged py3-none-any.
          # That is compatible with every platform, so pip picks it, the tag check
          # below waves it through as a pure-Python wheel, and the deploy ships a
          # placeholder in place of the 23MB wasm wheel.
          pip download mlir-python-bindings --plat "$PYODIDE_PLATFORM_TAG" --no-deps \
            --python-version "${PYODIDE_PY_TAG#cp}" --no-index -f page/index.html

          # Belt and braces: the wheel that lands must be the wasm one.
          ls mlir_python_bindings-*-"$PYODIDE_PLATFORM_TAG".whl

      - name: Get eudsl-python-extras
        shell: bash
        run: |
          set -euxo pipefail

          pip wheel eudsl-python-extras --no-index -f page/index.html --no-deps -w .

      - name: Create WASM console page
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p page/console

          MLIR_PYTHON_WHEEL_NAME="$(ls mlir_python_bindings*.whl)"
          EUDSL_PYTHON_EXTRAS_WHEEL_NAME="$(ls eudsl_python_extras*.whl)"
          # `ls` returns one line per match, so this also catches an ambiguous glob.
          test -f "$MLIR_PYTHON_WHEEL_NAME"
          test -f "$EUDSL_PYTHON_EXTRAS_WHEEL_NAME"

          cp pages/console/index.html page/console/index.html
          cp "$MLIR_PYTHON_WHEEL_NAME" "page/console/mlir_python_bindings-0.0.1-$PYODIDE_PY_TAG-$PYODIDE_PY_TAG-$PYODIDE_PLATFORM_TAG.whl"
          cp "$EUDSL_PYTHON_EXTRAS_WHEEL_NAME" page/console/eudsl_python_extras-0.0.1-py3-none-any.whl

          echo "MLIR_PYTHON_WHEEL_NAME=$MLIR_PYTHON_WHEEL_NAME" >> $GITHUB_ENV
          echo "EUDSL_PYTHON_EXTRAS_WHEEL_NAME=$EUDSL_PYTHON_EXTRAS_WHEEL_NAME" >> $GITHUB_ENV

      - name: Create WASM jupyterlite page
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p page/jupyter

          python -m pip install -r pages/jupyter/requirements.txt

          # jupyterlite-pyodide-kernel pins its own Pyodide (0.29.3 in 0.7.2),
          # which is not necessarily the one the wheel was built against.
          # JUPYTERLITE_PYODIDE_URL makes the build vendor a specific
          # distribution instead, so the notebook and the console run the same
          # Pyodide as the wheel's ABI. Keep in sync with PYODIDE_VERSION in
          # .github/actions/setup_base/action.yml.
          export JUPYTERLITE_PYODIDE_URL="https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-${PYODIDE_VERSION}.tar.bz2"

          jupyter lite build \
            --contents pages/jupyter/contents \
            --output-dir page/jupyter \
            --piplite-wheels $MLIR_PYTHON_WHEEL_NAME \
            --piplite-wheels $EUDSL_PYTHON_EXTRAS_WHEEL_NAME

      # A half-built `page/` must never reach the upload step: Pages serves whatever
      # the last deployment contained, so publishing a partial tree silently deletes
      # /console and /jupyter from the live site.
      - name: Verify page contents
        shell: bash
        run: |
          set -euxo pipefail

          # The console's Pyodide and the wheel's ABI tag must agree, or the
          # wheel silently fails to load. The build pins its cross-build env to
          # the same version (.github/actions/setup_base/action.yml); this checks
          # neither the console nor this workflow was bumped independently.
          #
          # Each version is asserted non-empty first. A grep that stops matching
          # (file renamed, format changed) yields an empty string, and comparing
          # two empty strings would otherwise pass the check vacuously -- and
          # `set -e` does not catch it, because the failing grep is not last in
          # its pipeline.
          console_pyodide=$(grep -oE 'cdn\.jsdelivr\.net/pyodide/v[0-9.]+' pages/console/index.html \
                            | head -1 | grep -oE '[0-9.]+$' || true)
          setup_pyodide=$(grep -oE '^ *PYODIDE_VERSION=[0-9.]+' .github/actions/setup_base/action.yml \
                          | head -1 | grep -oE '[0-9.]+$' || true)
          for name in console_pyodide setup_pyodide PYODIDE_VERSION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::could not determine $name -- the version check cannot run." \
                   "Did pages/console/index.html or setup_base/action.yml change format?"
              exit 1
            fi
          done
          for got in "$console_pyodide" "$PYODIDE_VERSION"; do
            if [ "$got" != "$setup_pyodide" ]; then
              echo "::error::Pyodide version mismatch: console=$console_pyodide," \
                   "deploy workflow=$PYODIDE_VERSION, wheel built against $setup_pyodide." \
                   "The wheel will not load."
              exit 1
            fi
          done

          # With JUPYTERLITE_PYODIDE_URL set, jupyterlite vendors that Pyodide
          # into static/pyodide (PyodideAddon.output_pyodide) instead of falling
          # back to the CDN default that jupyterlite-pyodide-kernel pins. If this
          # is missing the notebook is running a different Pyodide than the
          # wheel was built for.
          test -f page/jupyter/static/pyodide/pyodide.js

          test -f page/index.html
          test -f page/console/index.html
          test -f page/jupyter/index.html
          test -f page/jupyter/pypi/all.json

          # `jupyter lite build --contents` takes the whole directory, so a
          # notebook that fails to copy would otherwise go unnoticed until
          # someone opened the empty file browser.
          for nb in pages/jupyter/contents/*.ipynb; do
            test -f "page/jupyter/files/$(basename "$nb")"
          done

          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          platform_tag = os.environ["PYODIDE_PLATFORM_TAG"]

          with open("page/jupyter/pypi/all.json") as f:
              index = json.load(f)
          missing = [p for p in ("mlir-python-bindings", "eudsl-python-extras") if p not in index]
          if missing:
              raise SystemExit(f"piplite index is missing {missing}; got {sorted(index)}")

          # Naming the package is not enough. The pinned Pyodide only installs wheels whose
          # platform tag it recognises, so an index full of wheels tagged for a newer ABI
          # resolves and then fails at install time with "Can't find a pure Python 3 wheel".
          for name, pkg in index.items():
              for filename in (f["filename"] for files in pkg["releases"].values() for f in files):
                  tag = re.sub(r"\.whl$", "", filename).rsplit("-", 1)[-1]
                  # mlir-python-bindings is an extension package, so `any` here means a
                  # placeholder got resolved instead of the wasm wheel.
                  allowed = (platform_tag,) if name == "mlir-python-bindings" else (platform_tag, "any")
                  if tag not in allowed:
                      raise SystemExit(
                          f"{filename} is tagged {tag}, which the pinned Pyodide cannot install; "
                          f"expected one of {allowed}"
                      )

          # The console page hardcodes the wheel filenames it loads, so a rename on either
          # side silently turns into a 404 at runtime.
          console = pathlib.Path("page/console/index.html").read_text()
          for wheel in re.findall(r'loadPackage\("([^"]+\.whl)"\)', console):
              if not pathlib.Path("page/console", wheel).is_file():
                  raise SystemExit(f"page/console/index.html loads {wheel}, which is not in page/console/")
          PY

      - uses: geekyeggo/delete-artifact@v5
        if: success() && github.event_name != 'pull_request'
        with:
          name: github-pages
          failOnError: false

      - name: Upload artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: page

      - name: Deploy to GitHub Pages
        if: success() && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
