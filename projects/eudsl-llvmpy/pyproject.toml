[project]
name = "eudsl-llvmpy"
# The extension is built against the CPython stable ABI (nanobind STABLE_ABI),
# which nanobind only honors on Python >= 3.12, and the wheel is tagged
# cp312-abi3 (see wheel.py-api). pip therefore only installs it on 3.12+.
version = "0.0.1"
requires-python = ">=3.12"

[project.optional-dependencies]
ilp = ["ortools>=9.0"]

[project.urls]
Homepage = "https://github.com/llvm/eudsl"

[build-system]
requires = [
    "nanobind==2.13.0",
    "scikit-build-core==0.10.7",
    "typing_extensions>=4.12.2",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.source-dir = "."
wheel.packages = ["src/llvm"]
wheel.py-api = "cp312"
editable.mode = "redirect"
editable.verbose = true
editable.rebuild = false

[tool.scikit-build.cmake.define]
CMAKE_PREFIX_PATH = { env = "CMAKE_PREFIX_PATH", default = "" }
CMAKE_C_FLAGS = { env = "CMAKE_C_FLAGS", default = "" }
CMAKE_CXX_FLAGS = { env = "CMAKE_CXX_FLAGS", default = "" }
CMAKE_C_COMPILER_LAUNCHER = { env = "CMAKE_C_COMPILER_LAUNCHER", default = "" }
CMAKE_CXX_COMPILER_LAUNCHER = { env = "CMAKE_CXX_COMPILER_LAUNCHER", default = "" }
CMAKE_EXE_LINKER_FLAGS_INIT = { env = "CMAKE_EXE_LINKER_FLAGS_INIT", default = "" }
CMAKE_SHARED_LINKER_FLAGS_INIT = { env = "CMAKE_SHARED_LINKER_FLAGS_INIT", default = "" }
CMAKE_MODULE_LINKER_FLAGS_INIT = { env = "CMAKE_MODULE_LINKER_FLAGS_INIT", default = "" }
CMAKE_OSX_DEPLOYMENT_TARGET = { env = "CMAKE_OSX_DEPLOYMENT_TARGET", default = "13.0" }
CMAKE_C_VISIBILITY_PRESET = "hidden"
CMAKE_CXX_VISIBILITY_PRESET = "hidden"
CMAKE_VISIBILITY_INLINES_HIDDEN = "ON"
CMAKE_VERBOSE_MAKEFILE = "ON"
# Nothing here uses PCH; defining this skips HandleLLVMOptions' ccache+PCH
# warning on Windows.
CMAKE_DISABLE_PRECOMPILE_HEADERS = "ON"
LLVM_DIR = { env = "LLVM_DIR", default = "EMPTY" }
nanobind_DIR = { env = "nanobind_DIR", default = "" }

[tool.pytest.ini_options]
addopts = "--cov=llvm --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true
relative_files = true
# The compiled extension (eudslllvm_ext) and the generated stub are not Python
# source; coverage only measures the hand-written Python surface of `llvm`.
omit = [
    "*/eudslllvm_ext.pyi",
]

[tool.coverage.report]
omit = [
    "*/eudslllvm_ext.pyi",
]


[tool.cibuildwheel]
build-verbosity = 1
build = ["cp312-*"]
skip = ["*-manylinux_i686", "*-musllinux*", "*-win32"]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_34_aarch64"
environment-pass = [
    "CMAKE_PREFIX_PATH",
    "CMAKE_C_FLAGS",
    "CMAKE_CXX_FLAGS",
    "CMAKE_C_COMPILER_LAUNCHER",
    "CMAKE_CXX_COMPILER_LAUNCHER",
    "CMAKE_GENERATOR",
    "CC",
    "CXX",
    "LLVM_DIR",
    # ccache
    "CCACHE_DIR",
    "CCACHE_MAXSIZE",
    "CCACHE_SLOPPINESS",
    "CCACHE_CPP2",
    "CCACHE_UMASK",
    "CCACHE_NOHASHDIR",
    "PIP_FIND_LINKS",
]
# uncomment to make sure ccache is working inside containers
test-command = "ccache -sv"

[tool.cibuildwheel.linux]
before-all = [
    "yum install -y clang libarchive-devel antlr-tool libxml2-devel libxslt-devel libcurl-devel java java-devel",
    # ccache
    "curl -sLO https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-linux-$(arch)-musl-static.tar.xz && tar -xf ccache-4.14.1-linux-$(arch)-musl-static.tar.xz && make -C ccache-4.14.1-linux-$(arch)-musl-static install && ln -sf /usr/local/bin/ccache /usr/bin/ccache",
    "ccache -z"
]
# synchronize TZ with host so ccache files have correct timestamp
container-engine = { name = "docker", create-args = ["-v", "/etc/timezone:/etc/timezone:ro", "-v", "/etc/localtime:/etc/localtime:ro"] }

[tool.cibuildwheel.macos]
# skip the free-threaded 3.14 build on macOS
skip = "cp314t-*"
before-build = [
    "ccache -z",
]

[tool.cibuildwheel.windows]
skip = "cp314t-*"
